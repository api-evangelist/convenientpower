name: ConvenientPower
description: >-
  ConvenientPower (Chengdu ConvenientPower Semiconductor, 成都市易冲半导体有限公司) is an
  analog and mixed-signal integrated-circuit design company founded in 2016 and
  headquartered in Chengdu, Sichuan, China, with offices in Beijing, Shanghai,
  Xi'an, Shenzhen, Hong Kong, Taiwan, and Silicon Valley. The company designs
  high-performance power-management ICs spanning the full link from 220V mains to
  battery: wireless-charging transmitters and receivers (Qi, up to 100W), USB
  Power Delivery and UFCS protocol controllers, AC/DC flyback and synchronous
  rectifier controllers, GaN-integrated solutions, battery-charging management,
  LDOs and DC/DC converters, and automotive-grade power ICs (wireless charging,
  LED lighting, eFuse protection, switches). Its parts ship into consumer
  electronics, accessories, and automotive markets, with more than 330 million
  units shipped and 160+ patents; automotive ICs are AEC-Q100 qualified. As a
  hardware semiconductor vendor, ConvenientPower exposes developer resources as
  chip SDK toolkits, reference designs, and design software rather than a public
  web API. It was surfaced as a portfolio company of Qiming Venture Partners.
